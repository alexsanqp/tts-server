[server]
# Bind to loopback by default — front with a reverse proxy if you need
# external reach. Switching to "0.0.0.0" requires setting `auth_token`
# below; the server refuses to start with an open synth endpoint on
# a routable interface.
host = "127.0.0.1"
port = 8880

# CORS allowlist for browser clients. Empty = no CORS middleware, fetch
# from other origins is blocked by the browser. Set to ["*"] for fully
# open dev, or list specific origins (e.g. ["https://app.example.com"])
# for production.
cors_allow_origins = []
# Set a token to enable bearer auth. Empty disables auth on all endpoints
# EXCEPT /v1/refs (which always requires auth — uploads are the only write surface).
auth_token = ""
request_timeout_seconds = 300
max_queue_depth = 32

[refs]
catalog_dir = "data/refs-catalog"
upload_dir  = "data/refs"
upload_ttl_hours = 24
max_upload_mb = 10

[cache]
enabled = true
max_entries = 256

[providers]
# Enable providers after installing the matching extra:
#   pip install -e ".[edge]"       -> edge
#   pip install -e ".[qwen]"       -> qwen3-0.6b / qwen3-1.7b
#   pip install -e ".[styletts2]"  -> styletts2-uk
#
# qwen3-0.6b and qwen3-1.7b share the same provider class — pick one (or
# both, if you have the VRAM budget). 1.7B has measurably lower WER but
# needs ~6-8 GB peak; 0.6B is the fast fallback at ~4 GB.
enabled  = ["fake", "edge", "qwen3-0.6b", "styletts2-uk"]
# A required provider whose load fails makes /readyz report 503.
required = []

[providers.fake]
default_voice = "fake-en"

[providers.edge]
default_voice = "en-US-AriaNeural"

[providers.qwen3-0.6b]
port = 8890
host = "127.0.0.1"
ref_audio_dir = "data/refs-catalog"
model_name = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
device = "cuda:0"
startup_timeout_seconds = 180

# Higher-quality Qwen variant. Add "qwen3-1.7b" to `providers.enabled`
# (and route the languages you care about to it under [routing.by_language])
# to opt in. Sidecar runs on its own port so both can coexist.
[providers.qwen3-1.7b]
port = 8891
host = "127.0.0.1"
ref_audio_dir = "data/refs-catalog"
model_name = "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
device = "cuda:0"
startup_timeout_seconds = 300

[providers.styletts2-uk]
default_voice = "Марина Панас"

[routing]
default = "fake"

[routing.by_language]
en = "qwen3-0.6b"
uk = "styletts2-uk"
de = "qwen3-0.6b"
fr = "qwen3-0.6b"
es = "qwen3-0.6b"
ru = "qwen3-0.6b"
it = "qwen3-0.6b"
zh = "qwen3-0.6b"
ja = "qwen3-0.6b"
ko = "qwen3-0.6b"
pt = "qwen3-0.6b"
